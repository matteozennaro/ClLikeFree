[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-like-free"
version = "0.1.0"
description = "A cosmological angular power spectrum likelihood package"
dependencies = [
    "numpy",
    "scipy",
    "pyccl",
    "sacc",
    "baccoemu",
]

[tool.setuptools.packages.find]
include = ["cl_like_free*"]
