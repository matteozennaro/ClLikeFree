  #   proposal: 0.001

  sigma8:
    prior:
      min: 0.4
      max: 1.1
    ref:
      dist: norm
      loc: 0.82
      scale: 0.01
    latex: \sigma_{8}
    proposal: 0.001

  Omega_m:
    prior:
      min: 0.1
      max: 0.7
    ref:
      dist: norm
      loc: 0.2
      scale: 0.01
    latex: \Omega_{\rm m}
    proposal: 0.01

  h:
    prior:
      min: 0.55
      max: 0.9
    ref:
      dist: norm
      loc: 0.67
      scale: 0.01
    latex: h
    proposal: 0.01

  Omega_b:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.05
      scale: 0.01
    latex: \Omega_{\rm b}
    proposal: 0.01

  n_s:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96
      scale: 0.01
    latex: n_{\rm s}
    proposal: 0.01

  m_nu: 0.06

  # sigma8:
  #   latex: \sigma_8

  S8:
    latex: S_8

  # Nuisance parameters
    # ND (DECALS + KiDS)
  bias_DESI_LRG__0_b1:
    prior:
        min: -1
        max: 3
    ref:
      dist: norm
      loc: 1.13
      scale: 0.1
    latex: b^{DESI_LRG_0}_1
    proposal: 0.1

  bias_DESI_LRG__0_b2:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_0}_2
    proposal: 0.1

  bias_DESI_LRG__0_bs:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_0}_{s^2}
    proposal: 0.1

  bias_DESI_LRG__0_bk2:
    prior:
        min: -5
        max: 5
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_0}_{\nabla^2\delta}
    proposal: 0.1

  bias_DESI_LRG__1_b1:
    prior:
        min: -1
        max: 3
    ref:
      dist: norm
      loc: 1.13
      scale: 0.1
    latex: b^{DESI_LRG_1}_1
    proposal: 0.1

  bias_DESI_LRG__1_b2:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_1}_2
    proposal: 0.1

  bias_DESI_LRG__1_bs:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_1}_{s^2}
    proposal: 0.1

  bias_DESI_LRG__1_bk2:
    prior:
        min: -5
        max: 5
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_1}_{\nabla^2\delta}
    proposal: 0.1

  bias_DESI_LRG__2_b1:
    prior:
        min: -1
        max: 3
    ref:
      dist: norm
      loc: 1.13
      scale: 0.1
    latex: b^{DESI_LRG_2}_1
    proposal: 0.1

  bias_DESI_LRG__2_b2:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_2}_2
    proposal: 0.1

  bias_DESI_LRG__2_bs:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_2}_{s^2}
    proposal: 0.1

  bias_DESI_LRG__2_bk2:
    prior:
        min: -5
        max: 5
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_2}_{\nabla^2\delta}
    proposal: 0.1

  bias_DESI_LRG__3_b1:
    prior:
        min: -1
        max: 3
    ref:
      dist: norm
      loc: 1.13
      scale: 0.1
    latex: b^{DESI_LRG_3}_1
    proposal: 0.1

  bias_DESI_LRG__3_b2:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_3}_2
    proposal: 0.1

  bias_DESI_LRG__3_bs:
    prior:
        min: -3
        max: 3
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_3}_{s^2}
    proposal: 0.1

  bias_DESI_LRG__3_bk2:
    prior:
        min: -5
        max: 5
    ref:
      dist: norm
      loc: 0.13
      scale: 0.1
    latex: b^{DESI_LRG_3}_{\nabla^2\delta}
    proposal: 0.1

  bias_DESI_LRG__0_s: 0.972
  bias_DESI_LRG__1_s: 1.044
  bias_DESI_LRG__2_s: 0.974
  bias_DESI_LRG__3_s: 0.988

  # parameters for weak lensing
  # DESY3wl biases
  # Bias parameters
  bias_DESY3wl__0_m:
    prior:
      dist: norm
      loc: -0.0063
      scale: 0.0091
    latex: m^{DESY3wl_0}
    proposal: 0.005

  bias_DESY3wl__1_m:
    prior:
      dist: norm
      loc: -0.0198
      scale: 0.0078
    latex: m^{DESY3wl_1}
    proposal: 0.005

  bias_DESY3wl__2_m:
    prior:
      dist: norm
      loc: -0.0241
      scale: 0.0076
    latex: m^{DESY3wl_2}
    proposal: 0.005

  bias_DESY3wl__3_m:
    prior:
      dist: norm
      loc: -0.0369
      scale: 0.0076
    latex: m^{DESY3wl_3}
    proposal: 0.005

  limber_DESY3wl__0_dz:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.018
    latex: \Delta z^{DESY3wl_0}
    proposal: 0.005

  limber_DESY3wl__1_dz:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.015
    latex: \Delta z^{DESY3wl_1}
    proposal: 0.005

  limber_DESY3wl__2_dz:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.011
    latex: \Delta z^{DESY3wl_2}
    proposal: 0.005

  limber_DESY3wl__3_dz:
    prior:
      dist: norm
      loc: 0.0
      scale: 0.017
    latex: \Delta z^{DESY3wl_3}
    proposal: 0.005

  # Intrinsic alignments for DES sample
  bias_DESY3wl_A_IA:
    prior:
      min: -5
      max: 5
    ref:
      dist: norm
      loc: 0.
      scale: 0.1
    latex: A^{\rm DESY3wl}_{IA}
    proposal: 0.1

  limber_DESY3wl_eta_IA:
    prior:
      min: -5
      max: 5
    ref:
      dist: norm
      loc: 0.
      scale: 0.1
    latex: \eta^{\rm DESY3wl}_{IA}
    proposal: 0.1

  # BCM parameters
  M_c:
    prior:
      min: 9.0
      max: 15.0
    ref:
      dist: norm
      loc: 13
      scale: 1
    proposal: 0.5
    latex: \log_{10}(M_c)
  eta:
    prior:
      min: -0.7 # -0.69897 is the exact boundary in baryon emu
      max: 0.7  # 0.69897 is the exact boundary in baryon emu
    ref:
      dist: norm
      loc: -0.3
      scale: 0.1
    proposal: 0.05
    latex: \log_{10}(\eta)
  beta:
    prior:
      min: -1.0
      max: 0.7  # 0.69897 is the exact boundary in baryon emu
    ref:
      dist: norm
      loc: -0.22
      scale: 0.1
    proposal: 0.05
    latex: \log_{10}(\beta)
  M1_z0_cen:
    prior:
      min: 9.0
      max: 13
    ref:
      dist: norm
      loc: 12.5
      scale: 0.5
    proposal: 0.5
    latex: \log_{10}(M_{z_0, {\rm cen}})
  theta_inn:
    prior:
      min: -2.00
      max: -0.53  # -0.52287875 is the exact boundary in baryon emu
    ref:
      dist: norm
      loc: -0.86
      scale: 0.1
    proposal: 0.1
    latex: \log_{10}(\vartheta_{\rm inn})
  theta_out:
    # This is -log10(theta_out_in_paper)
    prior:
      min: 0.0
      max: 0.48  # 0.47712125 is the exact boundary in baryon emu
    ref:
      dist: norm
      loc: 0.25
      scale: 0.05
    proposal: 0.05
    latex: \log_{10}(\vartheta_{\rm out})
  M_inn:
    prior:
      min: 9.0
      max: 13.5
    ref:
      dist: norm
      loc: 12
      scale: 0.5
    proposal: 0.1
    latex: \log_{10}(M_{\rm inn})


# CCL settings
theory:
  cl_like.CCL:
    transfer_function: boltzmann_camb
    matter_pk: halofit
    baryons_pk: nobaryons
  cl_like.Pk:
    # Linear, EulerianPT, LagrangianPT
    bias_model: "BaccoHEFT"
    zmax_pks: 1.5
    use_baryon_boost: True
    nonlinear_emu_model_name: Arico2023
    allow_bcm_emu_extrapolation_for_shear: True
    allow_halofit_extrapolation_for_shear: True
    matter_model: Bacco
    baryon_model: Bacco
    baryons_in_gglensing: True
  cl_like.Limber:
    nz_model: "NzShift"
    ia_model: "IADESY1_PerSurvey"
    input_params_prefix: "limber"
  cl_like.ClFinal:
    input_params_prefix: "bias"
    shape_model: ShapeMultiplicative


# Likelihood settings
likelihood:
  cl_like.ClLike:
    # Input sacc file
    input_file: /home/mzennaro/CosmoCodes/Notebooks/TestClLike/data/cls_cov_GSSC_20260313.fits
    # List all relevant bins. The clustering
    # bins are clX, the shear bins are shX.
    bins:
      - name: DESI_LRG__0
      - name: DESI_LRG__1
      - name: DESI_LRG__2
      - name: DESI_LRG__3
      - name: DESY3wl__0
      - name: DESY3wl__1
      - name: DESY3wl__2
      - name: DESY3wl__3
      - name: Planck__kappa18

    # List all 2-points that should go into the
    # data vector. For now we only include
    # galaxy-galaxy auto-correlations, but all
    # galaxy-shear and shear-shear correlations.
    twopoints:

      - bins: [DESI_LRG__0, DESI_LRG__0]
      - bins: [DESI_LRG__1, DESI_LRG__1]
      - bins: [DESI_LRG__2, DESI_LRG__2]
      - bins: [DESI_LRG__3, DESI_LRG__3]

      - bins: [DESI_LRG__0, DESY3wl__0]
      - bins: [DESI_LRG__0, DESY3wl__1]
      - bins: [DESI_LRG__0, DESY3wl__2]
      - bins: [DESI_LRG__0, DESY3wl__3]

      - bins: [DESI_LRG__1, DESY3wl__0]
      - bins: [DESI_LRG__1, DESY3wl__1]
      - bins: [DESI_LRG__1, DESY3wl__2]
      - bins: [DESI_LRG__1, DESY3wl__3]

      - bins: [DESI_LRG__2, DESY3wl__0]
      - bins: [DESI_LRG__2, DESY3wl__1]
      - bins: [DESI_LRG__2, DESY3wl__2]
      - bins: [DESI_LRG__2, DESY3wl__3]

      - bins: [DESI_LRG__3, DESY3wl__0]
      - bins: [DESI_LRG__3, DESY3wl__1]
      - bins: [DESI_LRG__3, DESY3wl__2]
      - bins: [DESI_LRG__3, DESY3wl__3]

      - bins: [DESY3wl__0, DESY3wl__0]
      - bins: [DESY3wl__0, DESY3wl__1]
      - bins: [DESY3wl__0, DESY3wl__2]
      - bins: [DESY3wl__0, DESY3wl__3]
      - bins: [DESY3wl__1, DESY3wl__1]
      - bins: [DESY3wl__1, DESY3wl__2]
      - bins: [DESY3wl__1, DESY3wl__3]
      - bins: [DESY3wl__2, DESY3wl__2]
      - bins: [DESY3wl__2, DESY3wl__3]
      - bins: [DESY3wl__3, DESY3wl__3]

      # this is only for 5x2point
      - bins: [DESI_LRG__0, Planck__kappa18]
      - bins: [DESI_LRG__1, Planck__kappa18]
      - bins: [DESI_LRG__2, Planck__kappa18]
      - bins: [DESI_LRG__3, Planck__kappa18]

      - bins: [DESY3wl__0, Planck__kappa18]
      - bins: [DESY3wl__1, Planck__kappa18]
      - bins: [DESY3wl__2, Planck__kappa18]
      - bins: [DESY3wl__3, Planck__kappa18]

    defaults:
      # Scale cut for galaxy clustering
      # (ignored for shear-shear)
      # kmax: 4
      # These ones will apply to all power
      # spectra (unless the lmax corresponding
      # to the chosen kmax is smaller).
      lmin: 20
      lmax: 4500

      # Note: as is now, we will be removing the DESgc x DESwl Cell at ell<30.
      # In the paper, those were kept and only removed for wl x wl wl x ACTDR6_kappa.
      DESY3wl__0:
        lmin: 20
      DESY3wl__1:
        lmin: 20
      DESY3wl__2:
        lmin: 20
      DESY3wl__3:
        lmin: 20
      DESI_LRG__0:
        lmin: 20
        kmax: 0.4
        mag_bias: True
      DESI_LRG__1:
        lmin: 20
        kmax: 0.4
        mag_bias: True
      DESI_LRG__2:
        lmin: 20
        kmax: 0.4
        mag_bias: True
      DESI_LRG__3:
        lmin: 20
        kmax: 0.4
        mag_bias: True

force: True
debug: False
output: 'chains/Test_DESI_LRG_DESY3wl_Planck18_kappa_5x2pt_baccoemu_galkmax0.4_Obh2prior'